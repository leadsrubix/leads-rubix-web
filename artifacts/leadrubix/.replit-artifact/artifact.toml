kind = "web"
previewPath = "/"
title = "Leads Rubix"
version = "1.0.0"
id = "artifacts/leadrubix"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25771

[services.development]
run = "pnpm --filter @workspace/leadrubix run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/leadrubix", "run", "build" ]
publicDir = "artifacts/leadrubix/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25771"
BASE_PATH = "/"
